name: Refresh Grand Prix data

on:
  schedule:
    # Check daily after race weekends; the source mirrors may publish days later.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gp-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'francescobraicovich/car-or-driver'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch the public race tables into a temporary directory
        run: node packages/research/node/fetch-data.mjs tmp/gp-fetch
      - name: Validate new Grand Prix and preserve published history
        id: race
        run: node tools/refresh-gp-data.mjs tmp/gp-fetch
      - uses: actions/setup-python@v6
        if: steps.race.outputs.updated == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install findings dependencies
        if: steps.race.outputs.updated == 'true'
        run: python -m pip install -r requirements-research.txt
      - name: Rebuild ratings, teammate graph, laps and circuit art
        if: steps.race.outputs.updated == 'true'
        run: npm run build:data
      - name: Check that new circuits can be drawn
        if: steps.race.outputs.updated == 'true'
        run: node tools/check-gp-build.mjs
      - name: Recompute Insights
        if: steps.race.outputs.updated == 'true'
        run: npm run research:findings
      - name: Update data-dependent regression fingerprints
        if: steps.race.outputs.updated == 'true'
        run: node tests/golden.mjs --update
      - name: Check the complete site and publication package
        if: steps.race.outputs.updated == 'true'
        run: |
          npm run lint
          npm test
          npm run check:publication
          node tools/build-pages.mjs https://car-or-driver.pages.dev/
      - name: Publish the checked data to main
        if: steps.race.outputs.updated == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.csv data/manifest.json data/model*.json data/export-rows.json data/teammate-graph.json data/race-laps site/assets/tracks.json site/js/insights-data.js tests/golden.json
          git diff --cached --check
          git commit -m "Update GP data"
          git push origin HEAD:main
